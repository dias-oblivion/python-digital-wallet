[project]
name = "digital-wallet"
version = "0.1.0"
description = "API REST de carteira digital — FastAPI + asyncpg (SQL nativo), em camadas com inversão de dependência"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "email-validator>=2.2",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    "structlog>=25.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "testcontainers[postgres]>=4.9",
    "ruff>=0.9",
    "mypy>=1.14",
    "coverage[toml]>=7.6",
    "asyncpg-stubs>=0.31.3",
]

# Aplicação, não biblioteca: não há wheel para construir. Sem isso, o uv tentaria instalar o
# projeto e os pacotes de topo (api, core, db, models, ports, services) iriam para o site-packages
# com nomes genéricos. Os imports resolvem pelo diretório de trabalho (pythonpath do pytest,
# prepend_sys_path do alembic, PYTHONPATH no Docker).
[tool.uv]
package = false

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "N", "RUF", "C4", "DTZ", "PT", "TID"]
# B008: chamar Depends() no default do argumento é o idioma do FastAPI
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["api", "core", "db", "models", "ports", "services", "tests"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["api", "core", "db", "models", "ports", "services", "main.py", "tests"]
# db/migrations/ é gerado pelo Alembic e segue o estilo dele; fora do strict
exclude = ["^db/migrations/"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "integration: exige Postgres real (Testcontainers + Docker)",
]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["src/wallet"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
